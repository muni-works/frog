<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Frog</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/frog/tokens.css">
<link rel="stylesheet" href="ds/frog/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div style="width: 100%; height: 860px; overflow: hidden;">
  <dc-import name="Workspace" platform="web" signed-out="{{yes}}" height="860" theme="{{theme}}" hint-size="100%,860px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"dark"},"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark', yes: true };
  }
}
</script>
</body>
</html>
