body{margin:0}
a{color:var(--fg)}a:hover{color:var(--frog)}

.s-dot[aria-current="true"] span{color:var(--fg)}

.hint i::after{content:"";position:absolute;left:0;top:-12px;width:1px;height:12px;background:#ececec;animation:drip 2.2s cubic-bezier(.6,0,.4,1) infinite}
@keyframes drip{to{top:36px}}
@media (prefers-reduced-motion: reduce){.hint i::after{animation:none;top:12px}}
@media (max-width: 640px){.nav-x,.cite{display:none}.pip{left:16px;right:16px;width:auto;bottom:20px}#s-title{letter-spacing:-.035em}}

      ctx.globalAlpha = show * .9; path(i0, q);
      const [px2, py2] = route(i0, q); glowDot(px2, py2, '#30d158', 2.6, show);
      if (q < .12) { ctx.globalAlpha = show * (1 - q / .12); ctx.strokeStyle = '#0a84ff'; ctx.beginPath(); ctx.arc(E[0], E[1], 6 + q * 200, 0, 6.283); ctx.stroke(); }

      const [name, cap, pw] = PLAN[i0];
      callout(E[0], E[1], ['Earth', '1.00 AU'], '#0a84ff', -1); callout(M[0], M[1], ['Mars', '1.52 AU'], '#ff453a', -1);
      if (q < .85) callout(px2, py2, [`${name}${i0 === 0 ? ' · now' : ''}`, cap, `order ${pw}`], '#30d158', px2 > W * .5 ? -1 : 1);

    }
    function orbit(s, a, dash) { ctx.save(); ctx.rotate(s.tilt); ctx.globalAlpha = a; ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = .75; ctx.setLineDash(dash ? [1.5, 6] : []); ctx.beginPath(); ctx.ellipse(0, 0, s.rx, s.ry, 0, 0, 6.283); ctx.stroke(); ctx.restore(); }

    const main = $('s-main'), app = $('s-app'), pip = $('s-pip'); let pipAt = -2;
    let cx = 0, cy = 0, fx = 0, fy = 0, z = 1; const t0 = performance.now();

      const id = ORDER[scene], T = still ? 0 : now, p = u - scene, intro = still ? 1 : ease((now - t0) / 2600);
      dots.forEach((d, j) => d.querySelector('b').style.width = (j < scene ? 100 : j === scene ? p * 100 : 0) + '%');
      const mb = main.getBoundingClientRect().bottom - cv.getBoundingClientRect().top, room = H - mb - 28;
      const g = Math.max(.35, Math.min(1, (W - 32) / 660, room / 440));
      cx = W / 2; const ty = mb + 14 + room / 2; cy = cy ? cy + (ty - cy) * .08 : ty; // ease as the copy height changes
      let roll; [fx, fy, z, roll] = cam(); z *= g;
      const hold = id === 6 ? 0 : 1; fx += Math.sin(T / 9000) * 6 * hold; fy += Math.cos(T / 11000) * 4 * hold; // a slow handheld drift
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
      ctx.translate(cx, cy); ctx.rotate(roll); ctx.scale(z, z); ctx.translate(-fx, -fy);

      const form = intro, w = id === 6 ? 1 - ease((p - .5) / .45) : 0, fade = id === 6 ? 1 - ease((p - .35) / .25) : 0;
      app.style.opacity = fade; app.style.left = (cx - 590) + 'px'; app.style.top = (cy - 360) + 'px'; app.style.transform = `scale(${.56 * g * (.97 + .03 * fade)})`;
      if (pipAt !== scene) { pipAt = scene; pip.classList.toggle('on', !!PIP[scene]); if (PIP[scene]) pip.innerHTML = PIP[scene]; }
      const elVis = i => id === 0 ? 0 : id === 1 ? ease((p * 7 - i * .7)) : 1;
      SHELLS.slice(0, 3).forEach((s, i) => orbit(s, (id === 0 || id === 6 ? 0 : id === 1 ? ease(p * 4 - i * .5) : 1)));
      if (id === 4 || id === 5) orbit(SHELLS[3], id === 4 ? ease(p * 4) : 1, true);

      // electrons, back half first
      const live = ELS.map(([name, col, sh, ph], i) => { const s = SHELLS[sh], a = ph + T / 1000 * .75 * s.sp; let [x, y] = pos(s, a); if (w > 0) { const [lx, ly] = LAND[name]; x += (lx - x) * w; y += (ly - y) * w; } return { name, col, x, y, back: Math.sin(a) < 0 && w < .5, v: id === 6 ? 0 : elVis(i) }; });
      if (id === 2) { // a looping command, ejected on the third try
        const a = 1.4 + T / 1000 * 1.3, [x, y] = pos(SHELLS[0], a), out = ease((p - .55) * 3);
        const tries = Math.min(3, 1 + Math.floor(p / .2));

      }
      if (id >= 4 && id < 6) { const a = .3 + T / 1000 * .2, [x, y] = pos(SHELLS[3], a); live.push({ name: 'cloud/ · when you ask', col: '#64d2ff', x, y, back: Math.sin(a) < 0, v: id === 4 ? ease(p * 4) : 1, cloud: true }); }
      const draw = e => { if (e.v <= 0) return; glowDot(e.x, e.y, e.col, 2, e.v * (e.back ? .55 : 1)); label(e.x, e.y, e.name, e.col, e.v * (e.back ? .45 : .85)); };
      live.filter(e => e.back).forEach(draw);

      live.filter(e => !e.back).forEach(draw);

      if (id === 3) { // the boundary, and a request that bounces off it
        const R = 340, g = ease(p * 3);
        ctx.globalAlpha = .5 * g; ctx.strokeStyle = '#30d158'; ctx.setLineDash([3, 7]); ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.arc(0, 0, R, 0, 6.283); ctx.stroke(); ctx.setLineDash([]); ctx.lineWidth = 1;
        label(-R * .7, -R * .72, 'your Mac', '#30d158', .8 * g);
        const q = (p - .2) / .7; if (q > 0 && q < 1) {
          const hit = .5, d = q < hit ? 760 - (760 - R - 6) * ease(q / hit) : R + 6 + 380 * ease((q - hit) / (1 - hit));
          const x = d * Math.cos(-.5), y = d * Math.sin(-.5);
          glowDot(x, y, '#ff453a', 2.6, 1 - ease((q - .75) * 4)); label(x, y, 'ignore previous instructions…', '#ff453a', .8 * (1 - ease((q - .75) * 4)));
          if (Math.abs(q - hit) < .08) { ctx.globalAlpha = 1 - Math.abs(q - hit) / .08; ctx.strokeStyle = '#ff453a'; ctx.beginPath(); ctx.arc(R * Math.cos(-.5), R * Math.sin(-.5), 26, 0, 6.283); ctx.stroke(); }
        }
      }
      if (id === 4) { // one packet out to the cloud and home again
        const c = live.find(e => e.cloud), q = (p - .25) / .6;
        if (q > 0 && q < 1) {
          const outb = q < .45, k = outb ? ease(q / .45) : q < .6 ? 1 : 1 - ease((q - .6) / .4);
          glowDot(c.x * k, c.y * k, outb ? '#64d2ff' : '#30d158', 3.4, 1);
          label(c.x * k, c.y * k + 26, outb ? 'dart · tz tests' : q < .6 ? '40 s on GPUs' : 'all green · back home', outb ? '#64d2ff' : '#30d158', .9);
        }
      }

      ctx.globalAlpha = 1;
      if (id === 5) starmap(p, T);
      if (!still) requestAnimationFrame(frame);
    }
  }
  const wait = setInterval(() => { const cv = document.getElementById('frogfx'); if (cv && cv.closest('.f-root') && !cv.dataset.on) { cv.dataset.on = 1; clearInterval(wait); boot(cv.closest('.f-root')); } }, 100);
})();
