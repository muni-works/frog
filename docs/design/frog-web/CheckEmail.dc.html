<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Check your email</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/frog/tokens.css">
<link rel="stylesheet" href="ds/frog/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--frog)}a:hover{color:var(--fg)}
</style>
</helmet>
<div data-theme="{{theme}}" class="f-root" style="min-height: 860px; background: var(--bg); display: flex; flex-direction: column; font-size: 17px; line-height: 1.55;">
  <header style="display: flex; align-items: center; padding: 20px 32px;">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--fg);">
      <img src="/_blob/a7cbfb1c65a16387b5addf3f6c09ad4c" alt="" style="width: 28px; height: 28px;">
      <span style="font-weight: 700; font-size: 19px; letter-spacing: -0.01em;">Frog</span>
    </a>
  </header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 16px 64px;">
    <div style="width: 100%; max-width: 440px; display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center;">
      <div style="width: 72px; height: 72px; border-radius: 22px; background: var(--frog-pad); display: flex; align-items: center; justify-content: center; color: var(--frog);">
        <svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="m4 7 8 6 8-6"></path></svg>
      </div>

      <sc-if value="{{sent}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; gap: 12px; align-items: center;">
          <h1 style="margin: 0; font-family: var(--font-display); font-size: 40px; line-height: 1.1; letter-spacing: -0.03em;">Check sam@hey.com</h1>
          <p style="margin: 0; font-size: 19px; color: var(--muted);">The link signs you in on this device and works for 15 minutes. You can leave this tab open.</p>
          <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 8px;">
            <button type="button" class="f-btn f-btn--bordered" disabled style="height: 44px; font-size: 15px; padding: 0 18px;">Resend in 30s</button>
            <a href="Main.dc.html" class="f-btn f-btn--plain" style="height: 44px; box-sizing: border-box; font-size: 15px; padding: 0 14px; text-decoration: none; display: inline-flex; align-items: center;">Use GitHub instead</a>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{expired}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-direction: column; gap: 12px; align-items: center;">
          <h1 style="margin: 0; font-family: var(--font-display); font-size: 40px; line-height: 1.1; letter-spacing: -0.03em;">That link expired</h1>
          <p style="margin: 0; font-size: 19px; color: var(--muted);">Links work for 15 minutes. I'll send a new one to sam@hey.com.</p>
          <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 8px;">
            <button type="button" class="f-btn f-btn--prominent" onClick="{{resend}}" style="height: 44px; font-size: 15px; padding: 0 20px;">Send a new link</button>
            <a href="Main.dc.html" class="f-btn f-btn--plain" style="height: 44px; box-sizing: border-box; font-size: 15px; padding: 0 14px; text-decoration: none; display: inline-flex; align-items: center;">Use GitHub instead</a>
          </div>
        </div>
      </sc-if>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"dark"},"variant":{"editor":"enum","options":["sent","expired"],"default":"sent"},"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    const v = (this.state && this.state.variant) || this.props.variant || 'sent';
    return {
      theme: this.props.theme ?? 'dark',
      sent: v === 'sent',
      expired: v === 'expired',
      resend: () => this.setState({ variant: 'sent' }),
    };
  }
}
</script>
</body>
</html>
