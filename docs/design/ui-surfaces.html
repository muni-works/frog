<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>frog · ui surfaces</title>
<style>
/* tokens: chief design/system/tokens.json v0.1.0 */
:root{
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  --rounded:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --quick:220ms cubic-bezier(.25,1,.5,1); --panel:420ms cubic-bezier(.34,1.3,.64,1); --hov:120ms cubic-bezier(0,0,.58,1);
}
body.dark{
  --bg:#1e1e1e;--surface:#292929;--hover:#303030;--line:#343434;--lineStrong:#3e3e3e;
  --text:#e8e8e6;--muted:#8f9297;--faint:#6b6e73;--accent:#58cc6f;--onAccent:#0f2419;
  --success:#30d158;--warning:#ff9f0a;--danger:#ff453a;--info:#0a84ff;--codebg:#262626;
  --dart:#429cff;--tree:#51da60;--bull:#a45cff;--side:#232323;--desk:#2b2d31;
  --menu:0 2px 6px rgba(0,0,0,.25);--float:0 10px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
body.light{
  --bg:#f4f4f4;--surface:#e8e8e8;--hover:#e0e0e0;--line:#dcdcdc;--lineStrong:#d2d2d2;
  --text:#15171a;--muted:#6b6f75;--faint:#9a9da2;--accent:#2e9e4f;--onAccent:#ffffff;
  --success:#34c759;--warning:#ff9500;--danger:#ff3b30;--info:#007aff;--codebg:#ebebeb;
  --dart:#3a89e0;--tree:#47c054;--bull:#9051e0;--side:#ececec;--desk:#d9dbe0;
  --menu:0 2px 6px rgba(0,0,0,.18);--float:0 10px 24px rgba(0,0,0,.18);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:13px/20px var(--ui);background:var(--desk);color:var(--text);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.cap{font-size:10px;line-height:14px} .callout{font-size:12px;line-height:17px}
.semi{font-weight:600} .med{font-weight:500}
.num{font-variant-numeric:tabular-nums}

/* page chrome */
#nav{position:sticky;top:0;z-index:50;display:flex;gap:4px;flex-wrap:wrap;align-items:center;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
#nav b{margin-right:8px;font-family:var(--rounded)}
#nav button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer;margin:2px}
#nav .sp{flex:1}
.state{padding:28px 0 36px;display:flex;flex-direction:column;align-items:center}
.state>h2{font:600 15px/20px var(--ui);margin:0 0 4px;width:1180px}
.state>p.lede{margin:0 0 14px;width:1180px;color:var(--muted);font-size:12px}
body.only #nav{display:none} body.only .state{padding:20px 0}
body.only .state>h2,body.only .state>p.lede{display:none}

/* mac window */
.win{width:1180px;height:760px;background:var(--bg);border-radius:12px;border:1px solid var(--lineStrong);box-shadow:var(--float);display:flex;flex-direction:column;overflow:hidden;position:relative}
.tb{height:44px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line)}
.tb .sp{flex:1}
.lights{display:flex;gap:8px;margin-right:6px}.lights i{width:12px;height:12px;border-radius:50%;background:#ff5f57;display:block}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.body{flex:1;display:flex;min-height:0}
.side{width:248px;flex:none;background:var(--side);border-right:1px solid var(--line);padding:6px 8px;overflow:hidden}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.scroll{flex:1;overflow:auto;padding:18px 0}
.col{width:560px;margin:0 auto}

/* sidebar rows */
.srow{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:6px;font-size:13px;line-height:17px}
.srow:hover{background:var(--hover)}
.srow.sel{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.srow .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .d{font-size:10px;color:var(--muted);line-height:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow.kid{padding-left:24px}
.mg{width:20px;height:20px;border-radius:5.6px;flex:none;display:grid;place-items:center;font:600 9px/1 var(--rounded);position:relative}
.gl{position:absolute;right:-5px;top:-5px;width:12px;height:12px;border-radius:50%;background:var(--side);display:grid;place-items:center}
.spin{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--faint);border-top-color:var(--text);animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ring{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--faint)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.hand{color:var(--warning);font-size:9px;line-height:1}
.side .sec{font-size:10px;color:var(--faint);padding:8px 8px 2px;font-weight:600}
.wrow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;margin-bottom:2px;font-weight:500;cursor:pointer}
.wrow:hover{background:var(--hover)}
.wrow.sel{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.count{margin-left:auto;font:600 11px/16px var(--ui);color:var(--warning);font-variant-numeric:tabular-nums}
.more{color:var(--muted);font-size:12px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font:11px/16px var(--mono);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap;color:var(--text)}
.chip .dot{width:6px;height:6px}
.chip.danger{border-color:color-mix(in srgb,var(--danger) 55%,transparent)}
.chip.danger .dot{background:var(--danger)}
.chip.warn .dot{background:var(--warning)}
.chip.ok .dot{background:var(--success)}
.chip.hollow .dot{border:1px solid var(--muted)}

/* buttons */
.btn{border-radius:8px;padding:3px 11px;font-size:12px;line-height:18px;border:1px solid var(--line);background:var(--surface);cursor:pointer;white-space:nowrap;transition:background var(--hov)}
.btn:hover{background:var(--hover)}
.btn:active{opacity:.8}
.btn.pri{background:var(--accent);color:var(--onAccent);border-color:transparent;font-weight:600}
.btn.pri:hover{filter:brightness(1.06)}
.btn.q{background:none;border-color:transparent;color:var(--muted)}
.btn.q:hover{background:var(--hover)}
.btn.dtext{color:var(--danger)}
.btn kbd{font:10px var(--ui);opacity:.7;margin-left:5px}
.btn.sm{padding:1px 9px;font-size:11px}

/* code */
.code{font:12px/18px var(--mono);background:var(--codebg);border:.5px solid var(--line);border-radius:8px;padding:6px 10px;white-space:pre-wrap;word-break:break-all}

/* approval card */
.card{position:relative;border-radius:14px;padding:14px;background:color-mix(in srgb,var(--surface) 72%,transparent);backdrop-filter:blur(20px) saturate(1.6);border:1px solid color-mix(in srgb,var(--warning) 45%,transparent)}
.card.danger{border:1.5px solid color-mix(in srgb,var(--danger) 60%,transparent)}
.card .h{display:flex;align-items:center;gap:8px}
.card .h .g{width:18px;display:grid;place-items:center;flex:none}
.card .h .who{font-weight:500}
.card .h .wants{font-weight:600}
.card .h .age{margin-left:auto;font-size:10px;color:var(--muted)}
.trail{font-size:10px;line-height:14px;color:var(--muted);margin:3px 0 10px 26px}
.trail b{font-weight:500;color:var(--text)}
.trail i{font-style:normal;color:var(--faint);padding:0 4px}
.card .code{margin:0 0 6px 26px}
.agent{margin:0 0 10px 26px;font-size:12px;color:var(--muted);border-left:2px solid var(--line);padding-left:8px;line-height:17px}
.rows{margin-left:26px;display:grid;grid-template-columns:70px 1fr;gap:6px 8px;font-size:12px;line-height:18px;align-items:start}
.rows .l{font-size:10px;color:var(--faint);font-weight:600;padding-top:1px}
.rows .v{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.take{font-weight:500}
.acts{display:flex;gap:8px;align-items:center;margin-top:14px}
.acts .sp{flex:1}
.gw{color:var(--warning)} .gd{color:var(--danger)}
.dollar{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;border:1.5px solid var(--warning);color:var(--warning);font:700 9px/1 var(--ui)}
.meter{position:relative;height:6px;border-radius:3px;background:var(--line);overflow:hidden;width:100%;margin:6px 0 3px}
.meter .u{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
.meter .c{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,var(--warning) 0 3px,transparent 3px 6px)}
.meter .o{position:absolute;top:0;bottom:0;background:var(--danger)}
.hold{position:relative;overflow:hidden;user-select:none;-webkit-user-select:none}
.hold .fill{position:absolute;inset:0;background:color-mix(in srgb,var(--danger) 25%,transparent);transform-origin:left;transform:scaleX(0)}
.hold.holding .fill{transform:scaleX(1);transition:transform 1.2s linear}
.hold span{position:relative}
.folded{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:12px;margin-bottom:8px}
.folded .sp{flex:1}
.undo{color:var(--accent);cursor:pointer;font-weight:500;background:none;border:0;padding:0;font-size:12px}
.okc{color:var(--success)}
.scope{position:absolute;z-index:20;width:330px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--menu);padding:6px;font-size:12px;line-height:16px}
.scope .o{display:flex;gap:8px;padding:7px 8px;border-radius:6px;cursor:pointer}
.scope .o:hover{background:var(--hover)}
.scope .o .r{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--faint);flex:none;margin-top:2px}
.scope .o.on .r{border:4px solid var(--accent)}
.scope .x{font-size:10px;color:var(--muted)}

/* transcript bits */
.turn{font-size:13px;line-height:20px;margin-bottom:12px}
.irow{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:3px 0}
.irow .w{color:var(--text);font-weight:500}
.irow .sp{flex:1}
.notice{text-align:center;font-size:10px;color:var(--muted);margin:10px 0}
.ububble{margin-left:auto;width:fit-content;max-width:420px;background:var(--dart);color:#fff;border-radius:18px;padding:8px 14px;margin-bottom:14px;font-size:13px}

/* composer */
.composer{margin:0 auto 14px;width:600px;border:1px solid var(--lineStrong);background:color-mix(in srgb,var(--bg) 95%,var(--text));border-radius:16px;padding:10px 14px;flex:none}
.composer .ph{color:var(--faint);height:22px}
.composer .bar{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:6px}
.composer .bar .sp{flex:1}
.mpill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px 2px 6px;background:color-mix(in srgb,var(--surface) 72%,transparent);border:1px solid var(--line);font-weight:500;cursor:pointer}

/* toolbar header */
.crumbs{display:flex;align-items:center;gap:2px;font-size:12px;color:var(--muted);white-space:nowrap}
.crumbs a{color:inherit;cursor:pointer;padding:1px 4px;border-radius:6px}
.crumbs a:hover{background:var(--hover)}
.crumbs a.cur{color:var(--text);font-weight:500}
.crumbs .sep{color:var(--faint)}
.capsule{display:flex;align-items:center;gap:10px;height:30px;padding:0 14px;border-radius:999px;background:color-mix(in srgb,var(--surface) 72%,transparent);border:1px solid var(--line);font-size:12px;white-space:nowrap}
.capsule .div{width:1px;height:14px;background:var(--line)}
.ctx{height:30px;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--line);font-size:10px;color:var(--muted);position:relative}
.ctx .sp{flex:1}
.badge{display:inline-flex;align-items:center;gap:5px;font:500 10px/14px var(--ui);color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 8px;cursor:pointer}
.badge .dot{width:6px;height:6px;background:var(--warning)}
.badge.open{border-color:color-mix(in srgb,var(--warning) 55%,transparent)}
.pop{position:absolute;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--menu);padding:12px;width:300px;font-size:12px;line-height:17px;color:var(--text)}
.pop h4{margin:0 0 2px;font-size:12px}
.pop p{margin:0 0 10px;color:var(--muted)}
.ret{display:flex;align-items:center;gap:10px;margin:0 auto 6px;width:600px;padding:8px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:12px;line-height:17px;transition:opacity var(--quick)}
.ret .sp{flex:1}
.gut{position:relative}
.gut::before{content:"✋";position:absolute;left:-24px;top:2px;font-size:10px;color:var(--warning)}

/* inbox */
.ibhead{display:flex;align-items:center;gap:14px;padding:16px 28px 10px}
.ibhead h1{font:600 17px/22px var(--ui);margin:0}
.ibhead .sp{flex:1}
.tabs{display:flex;gap:2px;background:var(--surface);border-radius:8px;padding:2px}
.tabs button{border:0;background:none;padding:2px 12px;border-radius:6px;font-size:12px;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--bg);color:var(--text);font-weight:500;box-shadow:0 0 0 .5px var(--line)}
.ib{padding:0 28px 24px;overflow:auto;flex:1}
.lane{border:1px solid color-mix(in srgb,var(--danger) 45%,transparent);border-radius:12px;padding:4px;margin-bottom:14px}
.lh{font-size:10px;font-weight:600;color:var(--muted);padding:4px 10px 2px;display:flex;gap:6px;align-items:center}
.grp{margin-bottom:12px}
.gh{display:flex;align-items:center;gap:8px;padding:4px 10px;font-size:12px}
.gh .n{font-weight:600}
.gh .s{color:var(--muted);font-size:10px}
.ir{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;font-size:12px;cursor:pointer;transition:background var(--hov)}
.ir:hover{background:var(--hover)}
.ir .lead{width:18px;display:grid;place-items:center;flex:none}
.ir .who{font-weight:500;white-space:nowrap}
.ir .wh{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.ir .age{font-size:10px;color:var(--muted);width:24px;text-align:right;flex:none}
.ir .chev{color:var(--faint);font-size:10px;width:10px}
.ir.open{background:color-mix(in srgb,var(--surface) 45%,transparent)}
.exp{padding:6px 0 10px 28px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center}
.empty h1{font:600 17px/22px var(--ui);margin:12px 0 0}

/* digest */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .v{font:600 22px/28px var(--ui);font-variant-numeric:tabular-nums}
.stat .k{font-size:10px;color:var(--muted);line-height:14px}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.panel h3{margin:0 0 8px;font-size:12px;font-weight:600}
.bars{display:flex;align-items:flex-end;gap:10px;height:120px;position:relative}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;font-size:10px;line-height:14px;color:var(--muted);height:100%;position:relative;z-index:1}
.bars .b i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0}
.bars .b.over i{background:var(--warning)}
.line5{position:absolute;left:0;right:0;height:0;border-top:1px dashed var(--text);opacity:.6;z-index:0;font-size:9px;color:var(--muted);text-align:right;line-height:12px}
.line5 span{position:relative;top:-14px}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl td{padding:4px 0;border-top:1px solid var(--line)}
.tbl tr:first-child td{border-top:0}
.tbl td.r{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.sug{display:flex;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:12px;line-height:16px}
.sug:first-of-type{border-top:0}
.sug .sp{flex:1}

/* picker */
.picker{position:absolute;width:480px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--float);padding:10px;font-size:12px;z-index:10}
.auto{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.auto.sel,.mate.sel{box-shadow:0 0 0 2px var(--accent);border-color:transparent}
.faces{display:flex;flex:none}.faces svg{margin-right:-6px}
.lineup{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0}
.mate{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);cursor:pointer;display:flex;flex-direction:column;gap:6px}
.mate:hover{border-color:var(--lineStrong)}
.mate .nm{font:600 15px/18px var(--ui)}
.mate .role{font-size:10px;line-height:13px;color:var(--muted);min-height:26px}
.q10{height:4px;border-radius:2px;background:var(--line);position:relative;overflow:hidden}
.q10 i{position:absolute;left:0;top:0;bottom:0;border-radius:2px}
.kv{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);line-height:14px}
.kv b{color:var(--text);font-weight:500;font-variant-numeric:tabular-nums}
.psec{font-size:10px;font-weight:600;color:var(--faint);padding:8px 6px 2px}
.prow{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:7px;font-size:12px}
.prow:hover{background:var(--hover)}
.prow .sp{flex:1}
.pfoot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:6px;padding:8px 6px 0;font-size:11px;color:var(--muted)}
.hovercard{position:absolute;width:260px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--float);padding:12px;font-size:12px;line-height:17px;z-index:11}
.hovercard .kv{font-size:11px;padding:2px 0}

/* desktop (notifications) */
.desk{width:1180px;height:760px;border-radius:12px;overflow:hidden;position:relative;background:linear-gradient(160deg,color-mix(in srgb,var(--desk) 82%,var(--info)) 0%,var(--desk) 55%,color-mix(in srgb,var(--desk) 85%,var(--tree)) 100%);border:1px solid var(--lineStrong)}
.mbar{height:26px;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(20px);display:flex;align-items:center;gap:16px;padding:0 14px;font-size:12px}
.mbar .sp{flex:1}
.mbface{display:flex;align-items:center;gap:4px;padding:1px 6px;border-radius:5px;background:color-mix(in srgb,var(--text) 14%,transparent);font-weight:600;font-variant-numeric:tabular-nums}
.mmenu{position:absolute;top:30px;width:340px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(30px);border:1px solid var(--line);border-radius:10px;box-shadow:var(--float);padding:6px;font-size:12px}
.mmenu .mi{display:flex;gap:8px;align-items:center;padding:4px 8px;border-radius:5px}
.mmenu .mi:hover{background:var(--info);color:#fff}
.mmenu .mi .sp{flex:1}
.mmenu .mh{font-size:10px;color:var(--muted);font-weight:600;padding:6px 8px 2px}
.mmenu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.note{position:absolute;right:14px;width:370px;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(30px);border:1px solid var(--line);border-radius:16px;box-shadow:var(--float);padding:10px 12px;font-size:12px;line-height:17px}
.note .nh{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted)}
.note .nh .sp{flex:1}
.note .nb{display:flex;gap:6px;margin-top:8px}
.note .nb .btn{flex:1;text-align:center}
.dock{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:10px;padding:6px 10px;border-radius:18px;background:color-mix(in srgb,var(--bg) 60%,transparent);backdrop-filter:blur(20px);border:1px solid var(--line)}
.dock .ic{width:48px;height:48px;border-radius:11px;background:var(--surface);display:grid;place-items:center;position:relative}
.dock .ic.frog{background:#15171a}
.dock .bd{position:absolute;top:-4px;right:-4px;background:var(--danger);color:#fff;font:600 11px/18px var(--ui);min-width:18px;height:18px;border-radius:9px;text-align:center;padding:0 5px}
.lbl{position:absolute;font-size:10px;line-height:14px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 8px;max-width:240px}

/* face motion */
.face g{transform-origin:50% 70%;animation:breathe 3.2s ease-in-out infinite}
.face.working g{animation:pump 1.1s ease-in-out infinite}
.face.waiting g{animation:tilt 1.8s ease-in-out infinite}
.face.sad g{animation:none;transform:translateY(1px)}
@keyframes breathe{50%{transform:scale(1.03,.97)}}
@keyframes pump{50%{transform:translateY(-1.5px) scale(1.02)}}
@keyframes tilt{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@media (prefers-reduced-motion:reduce){.face g,.spin{animation:none}}
body.still .face g,body.still .spin{animation:none}
</style>
</head>
<body class="dark">
<div id="nav"><b>frog · ui surfaces</b><span id="navbtns"></span><span class="sp"></span><button id="theme">light / dark (t)</button></div>
<div id="states"></div>
<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

/* ---------- primitives ---------- */
const ACC = { dart: 'var(--dart)', tree: 'var(--tree)', bull: 'var(--bull)' };
function face(color, s = 16, mood = 'idle', w = 13) {
  const smile = mood === 'sad' ? 'M11.5 25 Q16 21.5 20.5 25' : 'M10.5 21 Q16 26.5 21.5 21';
  return `<svg class="face ${mood}" width="${s}" height="${s}" viewBox="0 0 32 32" aria-hidden="true"><g>
  <ellipse cx="16" cy="19.5" rx="${w}" ry="10" fill="${color}"/>
  <circle cx="10" cy="10.5" r="5.6" fill="${color}"/><circle cx="22" cy="10.5" r="5.6" fill="${color}"/>
  <circle cx="10" cy="10.5" r="3.5" fill="#fbfbf9"/><circle cx="22" cy="10.5" r="3.5" fill="#fbfbf9"/>
  <circle cx="10.5" cy="11" r="2" fill="#15171a"/><circle cx="22.5" cy="11" r="2" fill="#15171a"/>
  <circle cx="11.2" cy="10.2" r=".6" fill="#fff"/><circle cx="23.2" cy="10.2" r=".6" fill="#fff"/>
  <path d="${smile}" stroke="#15171a" stroke-width="1.8" fill="none" stroke-linecap="round"/></g></svg>`;
}
const mface = (m, s = 16, mood = 'idle') => face(ACC[m], s, mood, { dart: 11, tree: 13, bull: 14.6 }[m]);

// folder tints: hsb(hash, .5, .72) per tokens, skipping the brown hues 15-50
function tint(name) {
  let h = 2166136261; for (const c of name) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; }
  let hue = (h >>> 8) % 360; if (hue >= 15 && hue <= 50) hue += 40;
  return `hsl(${hue} 45% 54%)`;
}
function mono(name, folder, glyph = '') {
  const c = tint(folder || name);
  const init = (name.match(/[a-z0-9]/i) || ['?'])[0].toUpperCase();
  return `<span class="mg" style="background:color-mix(in srgb,${c} 16%,transparent);color:${c};box-shadow:inset 0 0 0 .5px color-mix(in srgb,var(--text) 15%,transparent)">${init}${glyph ? `<span class="gl">${glyph}</span>` : ''}</span>`;
}
const G = {
  run: '<span class="spin"></span>',
  idle: '<span class="ring"></span>',
  wait: '<span class="hand">✋</span>',
  fail: '<span class="dot" style="background:var(--danger)"></span>',
};
const chip = (t, k = '') => `<span class="chip ${k}">${k ? '<span class="dot"></span>' : ''}${t}</span>`;
const trail = (steps) => `<div class="trail">${steps.map((s, i) => i === steps.length - 1 ? `<b>${s}</b>` : s).join('<i>→</i>')}</div>`;
const lights = '<div class="lights"><i></i><i></i><i></i></div>';

const SELN = { okc: 'okc manager', bf16: 'okc bf16 proj', serving: 'okc serving patch', tang: 'tang manager' };
/* ---------- sidebar: the shape of Cam's screenshot ---------- */
function sidebar(sel = 'inbox', waiting = 6, away = false) {
  const r = (name, folder, g, detail, cls = '', style = '') =>
    `<div class="srow ${cls} ${SELN[sel] === name ? 'sel' : ''}">${mono(name, folder, G[g] || '')}<div style="flex:1;min-width:0"><div class="t" style="${style}">${name}</div>${detail ? `<div class="d">${detail}</div>` : ''}</div></div>`;
  return `<div class="side"><div style="height:30px;display:flex;align-items:center;padding-left:6px">${lights}</div>
    <div class="wrow ${sel === 'inbox' ? 'sel' : ''}" data-go="inbox"><span class="hand" style="font-size:12px;width:20px;text-align:center">✋</span>waiting on you<span class="count">${waiting || ''}</span></div>
    <div class="srow"><span style="width:20px;text-align:center" class="muted">◷</span><span class="t" style="flex:1">activity</span><span class="cap muted num">11 live</span></div>
    <div class="sec">org</div>
    ${r('chief', 'chief', 'run', 'running · reading 3 reports')}
    ${r('okc manager', 'okc', 'idle', away || !waiting ? '5 workers · 1 failed' : '5 workers · 2 asks')}
    ${r('okc attn decode', 'okc', 'run', 'attn v3 check · 4m', 'kid')}
    ${away ? r('okc serving patch', 'okc', 'run', 'serving bench · 1h', 'kid') : r('okc serving patch', 'okc', 'wait', 'wants to ssh into its pod · 9m', 'kid')}
    ${r('okc decode layer', 'okc', 'run', 'bench 3 of 6 · 12m', 'kid')}
    ${r('okc bf16 proj', 'okc', waiting && !away ? 'wait' : 'run', waiting && !away ? 'wants to launch a pod · 4m' : 'bench running · 1h', 'kid')}
    ${r('okc prefill layer', 'okc', 'fail', !waiting ? 'failed · bench exited 1 · pod stopped' : 'failed · bench exited 1 · pod billing', 'kid', 'color:var(--danger)')}
    <div class="srow kid more"><span style="width:20px;text-align:center">⋯</span>+18 done</div>
    ${r('frog manager', 'frog', 'run', waiting ? '4 workers · 1 ask' : '4 workers')}
    ${r('tang manager', 'tang', 'idle', waiting ? '3 workers · 1 ask' : '3 workers')}
    ${r('frog cloud manager', 'zest', 'run', 'edge deploy prep')}
    ${r('blaze distill', 'blaze', 'run', 'cad baseline 41 of 50')}
    <div class="sec">today</div>
    ${r('challenges spec', 'frog', '', 'frog · 2h')}
  </div>`;
}

/* ---------- approval cards: one component, three weights ---------- */
function budget(used, cap, add) {
  const pct = (x) => Math.min(100, (x / cap) * 100);
  const over = used + add > cap;
  const left = Math.max(0, cap - used);
  return `<div style="width:100%">
    <div class="meter"><span class="u" style="width:${pct(used)}%"></span>
      <span class="c" style="left:${pct(used)}%;width:${pct(Math.min(add, left))}%"></span>
      ${over ? `<span class="o" style="left:${pct(used + left) - 1.5}%;width:1.5%"></span>` : ''}</div>
    <div class="num" style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);line-height:14px">
      <span><b style="color:var(--text);font-weight:500">$${used.toFixed(2)}</b> of $${cap} this week · dg4 bench pods</span>
      <span>${over ? `<span class="gd">+$${add.toFixed(2)} at its cap · $${(used + add - cap).toFixed(2)} over</span>` : `+$${add.toFixed(2)} at its 4h cap`}</span></div></div>`;
}

const CARD = {
  routine: {
    weight: 'routine', who: 'okc serving patch', wants: 'ssh into its pod', age: '9m',
    trail: ['auto flagged', 'context pass kept it', "chief didn't answer in 5m", 'you'],
    call: "ssh root@213.173.98.4 -p 22091 'cd /workspace/sglang && ./bench_serving.sh --tp 1'",
    agent: '“running the serving bench on the pod i started 20m ago. it reads the patch and writes results to /workspace only.”',
    rows: [
      ['why you', 'ssh-scratch is the chief’s class. the chief was busy with the tang manager for 5m.'],
      ['touches', chip('pod wm3z…ld8j · made by this session', 'ok') + chip('host 213.173.98.4') + chip('writes /workspace', 'hollow')],
      ['undo', 'stoppable · ending the ssh ends the bench'],
    ],
    take: 'allow once · its own pod, a read-mostly bench script',
  },
  spend: (over) => ({
    weight: 'spend', who: 'okc bf16 proj', wants: 'launch a pod', age: '4m',
    trail: ['auto flagged', 'context pass kept it', over ? 'chief: over dg4’s weekly budget' : 'chief: spend over $25 needs you', 'you'],
    call: 'runpod pod create --name bf16-proj-3 --gpu "H200 SXM" --count 1 \\\n  --image ghcr.io/muni-works/okc-bench@sha256:4be1… --max-runtime 4h --self-terminate',
    agent: '“third bf16 projection run. needs a clean H200 because okc’s shared one is queued for 40m.”',
    rows: [
      ['why you', over ? 'pod-spend: this would pass the dg4 budget the chief holds' : 'pod-spend over $25 in one call goes to you, not the chief'],
      ['touches', chip('$10.58/hr', 'warn') + chip('cap 4h = $42.32') + chip('self-terminates', 'ok') + chip('image pinned', 'ok') + chip('host runpod.io')],
      ['budget', budget(over ? 48.1 : 12.4, 60, 42.32)],
      ['undo', 'stoppable · billing stops when the pod does'],
    ],
    take: over ? 'allow at a $11.90 cap · that’s what dg4 has left, about 1h of bench' : 'allow once · pinned image, self-terminating, inside the week’s budget',
    over,
  }),
  danger: {
    weight: 'danger', who: 'tang kda port', wants: 'delete a worktree', age: '2m',
    trail: ['hard rule: rm -rf outside scratch', 'never-delegable', 'you'],
    call: 'rm -rf ~/Developer/tang/.worktrees/glm5-kda',
    agent: '“cleaning up. the KDA work moved to glm5-kda-v2, this one is stale.”',
    rows: [
      ['undo', '<span class="semi">can’t be undone</span> · not in a scratch dir, not made by this session'],
      ['touches', chip('2.1 GB · 412 files') + chip('3 uncommitted changes', 'danger') + chip('branch glm5-kda not pushed', 'danger') + chip('worktree of tang manager', 'hollow')],
      ['why you', 'deletes outside scratch are never delegable. no grant or chief can take this.'],
    ],
    take: 'deny · 3 changes and an unpushed branch exist nowhere else. ask it to push first.',
  },
};

function card(c, id) {
  const glyph = c.weight === 'danger' ? '<span class="gd" style="font-size:14px">⚠</span>'
    : c.weight === 'spend' ? '<span class="dollar">$</span>' : '<span class="gw">✋</span>';
  const rows = c.rows.map(([l, v]) => `<div class="l">${l}</div><div class="v">${v}</div>`).join('');
  let acts;
  if (c.weight === 'danger') {
    acts = `<button class="btn pri" data-ans="denied · asked it to push glm5-kda first" >Deny <kbd>⌘.</kbd></button>
      <button class="btn" data-ans="asked why · waiting on tang kda port">Ask why…</button>
      <span class="sp"></span>
      <button class="btn q" data-ans="denied with a note">Deny with note…</button>
      <button class="btn dtext hold" data-hold="deleted glm5-kda · 2.1 GB"><span class="fill"></span><span>Hold to delete</span></button>`;
  } else if (c.over) {
    acts = `<button class="btn pri" data-ans="allowed at an $11.90 cap · pod bf16-proj-3 starts in 4s">Allow at $11.90 cap <kbd>⌘↩</kbd></button>
      <button class="btn" data-ans="allowed once · $42.32 cap · dg4 now $30.42 over">Allow once</button>
      <span class="sp"></span>
      <button class="btn q" data-ans="asked why">Ask why…</button>
      <button class="btn" data-ans="denied">Deny <kbd>⌘.</kbd></button>`;
  } else {
    const what = c.weight === 'spend' ? 'pod bf16-proj-3 starts' : 'ssh starts';
    acts = `<button class="btn pri" data-ans="allowed once · ${what} in 4s">Allow once <kbd>⌘↩</kbd></button>
      <button class="btn" data-always>Always…</button>
      <span class="sp"></span>
      <button class="btn q" data-ans="asked why · waiting on ${c.who}">Ask why…</button>
      <button class="btn q" data-ans="denied with a note">Deny with note…</button>
      <button class="btn" data-ans="denied">Deny <kbd>⌘.</kbd></button>`;
  }
  return `<div class="card ${c.weight === 'danger' ? 'danger' : ''}" ${id ? `id="${id}"` : ''} data-weight="${c.weight}">
    <div class="h"><span class="g">${glyph}</span><span><span class="who">${c.who}</span> <span class="muted">wants to</span> <span class="wants">${c.wants}</span></span><span class="age">${c.age}</span></div>
    ${trail(c.trail)}
    <div class="code">${c.call}</div>
    <div class="agent">${c.agent}</div>
    <div class="rows">${rows}<div class="l">frog’s take</div><div class="v take">${c.take}</div></div>
    <div class="acts">${acts}</div></div>`;
}
function folded(text, undo = true, icon = '<span class="okc">✓</span>') {
  return `<div class="folded">${icon}<span>${text}</span><span class="sp"></span>${undo ? '<button class="undo" data-undo>Undo</button><span class="cap muted num" data-tick>4s</span>' : ''}</div>`;
}

/* ---------- a bit of transcript for context ---------- */
function transcriptHead(who) {
  if (who === 'okc serving patch') return `<div class="turn">the patch builds. i’ll run the serving bench on the pod i started, then post numbers to the okc manager.</div>
    <div class="irow"><span class="gw">✋</span><span class="w">Bash</span><span>ssh root@213.173.98.4 …</span><span class="cap semi gw">needs you</span><span class="sp"></span></div>`;
  if (who === 'tang kda port') return `<div class="turn">the KDA kernel moved to glm5-kda-v2 and passes parity there. cleaning up the old worktree.</div>
    <div class="irow"><span class="gw">✋</span><span class="w">Bash</span><span>rm -rf ~/Developer/tang/.worktrees/glm5-kda</span><span class="cap semi gw">needs you</span><span class="sp"></span></div>`;
  if (who === 'okc bf16 proj') return `<div class="turn">run 2 finished at 412 µs per layer. i’ll start run 3 on a clean H200, since the shared one is queued for 40 minutes.</div>
    <div class="irow"><span class="gw">✋</span><span class="w">Bash</span><span>runpod pod create …</span><span class="cap semi gw">needs you</span><span class="sp"></span></div>`;
  return `<div class="ububble">run the third bf16 projection bench and compare with run 2</div>
    <div class="turn">run 2 finished at 412 µs per layer. i’ll start run 3 on a clean H200, since the shared one is queued for 40 minutes.</div>
    <div class="irow"><span>✓</span><span class="w">Read</span><span>bench/bf16_proj.py</span><span class="sp"></span><span class="chip">+0 −0</span></div>
    <div class="irow"><span>✓</span><span class="w">Bash</span><span>python bench/compare.py run1 run2</span><span class="sp"></span><span class="okc">✓</span></div>
    <div class="irow"><span class="gw">✋</span><span class="w">Bash</span><span>runpod pod create …</span><span class="cap semi gw">needs you</span><span class="sp"></span></div>`;
}

/* ---------- session header: toolbar line + context row ---------- */
function toolbar(o = {}) {
  const crumbs = (o.crumbs || ['chief', 'okc manager', 'okc bf16 proj'])
    .map((c, i, a) => `<a class="${i === a.length - 1 ? 'cur' : ''}">${c}</a>`).join('<span class="sep">›</span>');
  const act = o.waiting
    ? `<span class="gw">✋</span><span class="med gw">${o.waiting}</span>`
    : `${face('var(--tree)', 16, 'working')}<span>${o.activity || 'running bench_bf16.py · 2m'}</span>`;
  const model = o.model || { m: 'tree', name: 'glm-5.3-flash', speed: '61 tok/s' };
  return `<div class="tb"><div class="crumbs">${crumbs}</div><span class="sp"></span>
    <div class="capsule">${act}<span class="div"></span>
      <span style="display:flex;align-items:center;gap:5px" class="med">${model.m ? mface(model.m, 14) : ''}${model.name}</span><span class="muted num">${model.speed}</span>
      ${o.elsewhere ? `<span class="div"></span><span class="gw med">${o.elsewhere}</span>` : ''}
    </div><span class="sp"></span>
    <span class="num med" title="hover: by model, tokens, energy">${o.cost || '$4.12'}</span>${o.team ? `<span class="cap muted num">team ${o.team}</span>` : ''}
  </div>`;
}
function ctxrow(o = {}) {
  const badges = (o.badges || []).map((b, i) => `<span class="badge ${o.open === i ? 'open' : ''}" data-badge="${i}"><span class="dot"></span>${b.what}</span>`).join('');
  return `<div class="ctx"><span class="chip" style="font-size:10px">${o.wt || 'muse_bf16_proj · muse/bf16-proj'}</span>
    <span>${o.age || '3h'}</span><span>·</span><span>${o.mode || 'auto'}</span>
    ${badges ? `<span style="width:6px"></span>${badges}` : ''}<span class="sp"></span>
    <span class="faint">${o.right || ''}</span></div>`;
}
const DEG = [
  { kind: 'model', what: 'on glm-5.3-flash, not opus', why: 'this session was on anthropic/claude-opus-5.5. it resumed without -m, so it took the global default.', fix: 'Switch back to opus' },
  { kind: 'text_tools', what: 'text tool calls', why: 'two native tool replies failed this session, so frog reads tool calls from text. slower, and calls fail more.', fix: 'Try native tools again' },
  { kind: 'classifier', what: 'classifier down · asking more', why: 'auto’s classifier (cloud/qwen3-8b) isn’t answering. apple on-device decides instead; gray-area calls ask.', fix: 'Use on-device check' },
];

function win(side, main, o = {}) {
  return `<div class="win">${side ? '' : ''}<div class="body">${side || ''}<div class="main">${main}</div></div></div>`;
}

/* ---------- screens ---------- */
const S = [];
function screen(id, title, lede, html, after) { S.push({ id, title, lede, html, after }); }

/* 1-3: the three weights */
function cardScreen(c, sel, extra = '') {
  return win(sidebar(sel), `${toolbar({ waiting: `${c.who} wants to ${c.wants}`, crumbs: ['chief', 'okc manager', c.who].map((x) => x === 'okc manager' && c.who.startsWith('tang') ? 'tang manager' : x) })}
    ${ctxrow({ wt: { 'okc serving patch': 'serving-sglang · okc/serving', 'okc bf16 proj': 'muse_bf16_proj · muse/bf16-proj', 'tang kda port': 'glm5-kda-v2 · glm5/kda-v2' }[c.who], age: c.who.startsWith('tang') ? '5h' : '3h' })}
    <div class="scroll"><div class="col">${transcriptHead(c.who)}${extra}<div data-slot>${card(c)}</div></div></div>
    <div class="composer"><div class="ph">steer, or press esc to stop…</div><div class="bar"><span class="mpill">${mface('tree', 14)}tree</span><span class="muted">auto</span><span class="sp"></span></div></div>`);
}
screen('card-routine', '1 · approval card: routine class',
  'the residue of a soft class: the chief would take it, but it didn’t answer in 5m. the trail says so. warning border, allow once is primary (⌘↩).',
  cardScreen(CARD.routine, 'serving'));
screen('card-spend', '2 · approval card: spend class',
  'adds the budget row: this week against the grant, with this call’s worst case hatched. click “over budget” to see the primary slot become a capped allow.',
  `<div style="width:1180px;margin:-6px 0 8px;display:flex;gap:6px"><button class="btn sm" data-spend="0">inside budget</button><button class="btn sm" data-spend="1">over budget</button></div>` +
  cardScreen(CARD.spend(false), 'bf16'));
screen('card-danger', '3 · approval card: irreversible (hard class)',
  'never-delegable: no chief, no grant. danger border, deny is primary, allow is “hold to delete” for 1.2s with no shortcut. try holding it.',
  cardScreen(CARD.danger, 'tang'));

/* 4: answering */
screen('card-answer', '4 · answering: always… scopes, and the answered fold',
  'always… never means a blank yes: it opens scopes, narrowest first. answered cards fold to one line with the consequence and 4s of undo (the call waits for the grace).',
  win(sidebar('serving'), `${toolbar({ crumbs: ['chief', 'okc manager', 'okc serving patch'], activity: 'running bench_serving.sh · 1m' })}${ctxrow({ wt: 'serving-sglang · okc/serving' })}
    <div class="scroll"><div class="col">
      <div class="cap muted" style="margin:0 0 6px">answered, as they read in the transcript and the inbox</div>
      ${folded('allowed once · ssh started on pod wm3z…ld8j')}
      ${folded('allowed at an $11.90 cap · pod bf16-proj-3 running · stops itself at $11.90', false)}
      ${folded('denied · “push glm5-kda first, then delete it” sent to tang kda port', false, '<span class="gd">✕</span>')}
      ${folded('asked why · tang kda port answered: “pushed. nothing left unique.” · card back in your inbox', false, '<span class="muted">↩</span>')}
      <div class="cap muted" style="margin:16px 0 6px">a routine card with always… open</div>
      <div style="position:relative">${card(CARD.routine)}
        <div class="scope" style="left:110px;bottom:50px;box-shadow:var(--float)">
          <div class="o"><span class="r"></span><div><div>this command prefix, this session</div><div class="x">ssh root@213.173.98.4 … · until the session ends</div></div></div>
          <div class="o on"><span class="r"></span><div><div>ssh-scratch for okc serving patch</div><div class="x">any pod this session made · 4 weeks</div></div></div>
          <div class="o"><span class="r"></span><div><div>ssh-scratch for okc manager and its workers</div><div class="x">becomes grant dg8 · pods they made · 4 weeks · revoke in one click</div></div></div>
          <div style="display:flex;justify-content:flex-end;gap:6px;padding:6px 4px 2px"><button class="btn sm q">Cancel</button><button class="btn sm pri">Allow always</button></div>
        </div>
      </div>
      <div style="height:150px"></div>
    </div></div>`));

/* 5-6: the inbox */
const ASKS = [
  { id: 'a1', lane: 'money', lead: '<span class="gd">⌁</span>', who: 'okc prefill layer', wh: 'failed 22m ago · its pod is still billing, nobody listening', chips: chip('$10.58/hr · $3.88 so far', 'danger'), age: '22m', first: 'Stop pod', mgr: 'okc' },
  { id: 'a2', who: 'okc bf16 proj', lead: '<span class="dollar">$</span>', wh: 'wants to launch a pod · H200 for 4h', chips: chip('≤$42.32', 'warn'), age: '4m', first: 'Allow once', mgr: 'okc', card: () => card(CARD.spend(false)) },
  { id: 'a3', who: 'okc serving patch', lead: '<span class="gw">✋</span>', wh: "wants to ssh into its pod · chief didn't answer", chips: chip('its own pod', 'ok'), age: '9m', first: 'Allow once', mgr: 'okc', card: () => card(CARD.routine) },
  { id: 'a4', who: 'tang kda port', lead: '<span class="gd">⚠</span>', wh: 'wants to delete a worktree', chips: chip('2.1 GB · can’t undo', 'danger'), age: '2m', first: 'Deny', mgr: 'tang', card: () => card(CARD.danger) },

  if (!undoable) return;
  let n = 4; const tick = $('[data-tick]', slot);
  const t = setInterval(() => { n--; if (tick) tick.textContent = n + 's'; if (n <= 0) { clearInterval(t); const u = $('[data-undo]', slot); if (u) u.remove(); if (tick) tick.remove(); } }, 1000);
  $('[data-undo]', slot).onclick = () => { clearInterval(t); slot.replaceWith(keep); };
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('button,[data-ask],[data-mate],[data-badge],[data-go],[data-nav]');
  if (!t) return;
  if (t.dataset.nav) { document.getElementById('s-' + t.dataset.nav).scrollIntoView({ behavior: 'smooth' }); return; }
  if (t.dataset.ans) { const c = t.closest('.card'); if (!c) return; const ex = c.closest('.exp'); if (ex) { const ir = ex.previousElementSibling; ex.innerHTML = folded(t.dataset.ans, false); ir.classList.remove('open'); ir.style.opacity = .4; } else fold(c, t.dataset.ans, !t.dataset.ans.startsWith('asked')); return; }
  if (t.dataset.quick) { e.stopPropagation(); const ir = t.closest('.ir'); const a = ASKS.find((x) => x.id === t.dataset.quick); ir.outerHTML = folded(`${a.first.toLowerCase()} · ${a.who}`, true); return; }
  if (t.dataset.ask) { const id = t.dataset.ask; const open = t.classList.contains('open'); $('#ibx').innerHTML = inbox(open ? null : id); return; }
  if (t.dataset.tab) { const box = t.closest('.main'); box.innerHTML = `<div class="tb"><span class="sp"></span><span class="cap muted">⌘⇧0</span></div><div id="ibx" style="display:flex;flex-direction:column;flex:1;min-height:0">${t.dataset.tab === 'digest' ? digest() : inbox()}</div>`; return; }
  if (t.dataset.spend !== undefined) { const sec = t.closest('.state'); const slot = $('[data-slot]', sec); slot.innerHTML = card(CARD.spend(t.dataset.spend === '1')); return; }
  if (t.dataset.badge !== undefined) { showDeg(t.closest('.state'), +t.dataset.badge, t); return; }
  if (t.dataset.mate) { const box = t.closest('.picker'); const signed = !box.textContent.includes('signed out'); box.innerHTML = picker(t.dataset.mate, signed); return; }
  if (t.hasAttribute('data-x')) { $('#ret').style.opacity = 0; return; }
  if (t.hasAttribute('data-show')) { $('.gut').scrollIntoView({ block: 'center' }); return; }
});

function showDeg(sec, i, el) {
  const pop = $('#degpop', sec); if (!pop) return;
  $$('.badge', sec).forEach((b) => b.classList.toggle('open', b === el));
  const d = DEG[i];
  pop.innerHTML = `<h4>${d.what}</h4><p>${d.why}</p><div style="display:flex;gap:6px"><button class="btn pri sm">${d.fix}</button><button class="btn q sm">Keep for now</button></div>`;
  pop.style.display = 'block'; const r = el.getBoundingClientRect(), w = pop.offsetParent.getBoundingClientRect();
  pop.style.left = (r.left - w.left) + 'px'; pop.style.top = (r.bottom - w.top + 6) + 'px';
  pop.style.display = 'block';
}
if (params.get('over')) { const sec = $('#s-card-spend'); if (sec) $('[data-slot]', sec).innerHTML = card(CARD.spend(true)); }
if (params.get('holding')) { const b = $('.hold'); if (b) { b.classList.add('holding'); b.querySelector('.fill').style.transition = 'none'; b.querySelector('.fill').style.transform = 'scaleX(.6)'; } }
const hs = $('#s-header'); if (hs) showDeg(hs, 0, $('.badge', hs));

// hold to delete: 1.2 s, cancels on release
document.addEventListener('pointerdown', (e) => {
  const h = e.target.closest('.hold'); if (!h) return;
  h.classList.add('holding');
  const timer = setTimeout(() => { const c = h.closest('.card'); if (c.closest('.exp')) c.closest('.exp').innerHTML = folded(h.dataset.hold, false, '<span class="gd">⚠</span>'); else fold(c, h.dataset.hold, false); }, 1200);
  const stop = () => { clearTimeout(timer); h.classList.remove('holding'); window.removeEventListener('pointerup', stop); h.removeEventListener('pointerleave', stop); };
  window.addEventListener('pointerup', stop); h.addEventListener('pointerleave', stop);
});

</script>
</body>
