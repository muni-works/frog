[package]
name = "node-face"
description = "The frog node's face: Pip's Soft Blocks eyes on the head's screen, driven by frog's state"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "node-face"
path = "src/main.rs"

[features]
default = []
# A window on the head's panel (X11/Wayland/macOS). Off by default so `cargo build --workspace` needs no GUI libraries.
window = ["dep:minifb"]

[dependencies]
# The puck crate already folds `frog --serve` into what a screen should show, and draws anti-aliased
# shapes and text into a framebuffer; the node's face reuses both.
puck = { path = "../puck" }
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
minifb = { version = "0.28", optional = true }
