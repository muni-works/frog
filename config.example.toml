# Copy to ~/.config/frog/config.toml

default_model = "qwen"

# Bash command prefixes that run without asking (on top of the built-in read-only list).
allow_bash = ["cargo check", "cargo test", "cargo clippy", "npm test", "npm run build"]

show_thinking = true
# Also load ~/.claude/CLAUDE.md and CLAUDE.md files as project instructions.
load_claude_md = true
# Start Read, Grep and Glob calls as soon as their arguments arrive, while the model is still
# writing the rest of its reply. Same results; less waiting.
# early_tools = true

# WebSearch backend: "searxng", "brave", "exa" or "tavily". Keys: `frog --set-key brave` (stdin),
# or BRAVE_SEARCH_API_KEY / EXA_API_KEY / TAVILY_API_KEY. Unconfigured, WebSearch isn't offered.
# web_search = "searxng"
# searxng_url = "http://localhost:8888"
# Let WebFetch reach localhost and private networks (default: public addresses only).
# web_allow_private = false

# When reasoning models think: "auto" (default), "always" or "never". thinking_budget caps
# reasoning tokens per call where the server takes it (frog's own engine); 0 is unlimited.
# A profile's own thinking / thinking_budget override these.
# thinking = "auto"
# thinking_budget = 1024

# Shell commands run sandboxed (writes only in the project, credentials hidden), so they run
# without asking. false: every command asks instead.
# sandbox_shell = true
# Let the agent see and drive macOS apps (the bundled frog-desktop MCP server).
# computer_use = false

# Auto mode's classifier (a profile or provider/model). Default: Apple's on-device model where
# it exists, else Frog Cloud's small model. The fallback is tried when it can't answer; unset,
# the session's own model judges, then frog's built-in rules.
# auto_classifier = "apple/on-device"
# auto_classifier_fallback = "cloud/deepseek-v4.1-flash"
# Seconds a permission prompt waits before frog denies the call and carries on. 0 waits forever.
# approval_timeout_secs = 600

# Helper models (a profile or provider/model). brief_model writes the pond's brief, gist_model
# the one-line gists on tool rows, compare_model judges screenshots (default: the session model
# when it has vision). subagent_model is what Task subagents use (default: the session's model).
# brief_model = "apple/on-device"
# gist_model = "apple/on-device"
# compare_model = "sonnet"
# subagent_model = "qwen"
# Steps a subagent may take before it has to report.
# subagent_max_steps = 100
# Child sessions one engine may own at once when no client hosts sessions.
# background_tasks = 4
# Screenshot service for page captures (default: the bundled WebKit sidecar).
# screenshot_endpoint = "http://localhost:3000/screenshot"

[models.qwen]
provider = "ollama"
model = "qwen3-coder:30b"
context_window = 65536       # sent as num_ctx — ollama's default is tiny

[models.gpt-oss]
provider = "ollama"
model = "gpt-oss:20b"
context_window = 65536
extra = { think = "medium" }  # merged into the request body

[models.lmstudio]
provider = "openai"
base_url = "http://localhost:1234/v1"
model = "qwen/qwen3-coder-30b"
context_window = 65536

[models.llamacpp]
provider = "openai"
base_url = "http://localhost:8080/v1"
model = "default"
context_window = 32768
# If the server's chat template mangles tool calls, describe tools in the prompt instead:
# tool_mode = "text"

# frog's own engine (tang-llm), started on demand. draft_model adds a small model that drafts
# tokens for the big one to verify: ~1.4x on CUDA, ~1.15x on Metal (needs tang-llm with draft-model support).
[models.qwen32]
provider = "openai"
model = "mlx-community/Qwen3-32B-4bit"
sidecar = "mlx-community/Qwen3-32B-4bit"
# draft_model = "mlx-community/Qwen3-0.6B-4bit"

[models.sonnet]
provider = "anthropic"
model = "claude-sonnet-5"
max_tokens = 32000
# api_key_env = "ANTHROPIC_API_KEY"  (default)

# Image generation is disabled unless explicitly configured. Uses the Image tool;
# every call asks permission in default mode. No key is needed for a local server.
# [image]
# backend = "remote"
# endpoint = "http://localhost:8080/v1/images/generations"
# model = "z-image-turbo"
# api_key_env = "IMAGE_API_KEY" # optional; environment variable containing a bearer token
# For offline UI testing, use backend = "stub" (PNG checkerboard placeholders).

# Delegated approvals (docs/design/delegation.md): a call the auto-mode
# classifier still flags after a context-rich second pass can be decided by
# the chief of staff's session instead of carding you — for the grant classes
# you list. rm -rf outside scratch, force-pushes, production deploys,
# purchases, public posts, credentials and deletes outside scratch are NEVER
# delegated; they always card you, whatever the config says.
# [delegation]
# chief = ["chief of staff"]            # session name(s) or id(s), SendMessage-style
# chief_classes = [                     # the vocabulary in docs/design/delegation.md
#   "ssh-scratch", "pod-spend", "own-scope-writes", "scratch-deletes",
#   "network-read-writes", "mcp-write-granted", "long-commands",
# ]
# chief_timeout_secs = 300              # then the card falls back to you
# rollup = true                         # one approvals roll-up notice per day, at most

# Holes in the shell sandbox, for tools that need a credential. Nothing widens unless set.
# [sandbox]
# allow_read = ["~/.config/gh"]                   # credential paths commands may read
# allow_write = ["~/Developer/.shared-target"]     # beyond the project, temp and caches
# allow_keychain = false                           # macOS: read the login Keychain (gh)
# network = "dev"                                  # macOS: only GitHub, crates.io, npm, Swift hosts
# git_https = false                                # sandboxed git reads over https via gh

# Hosts sandboxed commands may reach. Agent-started sessions enforce the list by default.
# [egress]
# allow = ["internal.example.com"]   # a domain covers its subdomains
# defaults = true                    # keep the built-in host list
# workers_deny_by_default = true     # agent sessions (--worker) enforce it
# interactive = "off"                # your own sessions: "off", "flag" or "enforce"

# MCP servers whose write tools may run without a card (each logged and shown as a notice).
# [mcp_trust]
# planetscale = "write"

# Compiled memory, with a model server that offers it: "auto" (default), "on" or "off".
# [memory]
# compiled = "auto"

# The IRC agent bus (docs/design/agent-bus-irc.md). Off by default; the token lives in the
# keychain under `account` (or FROG_IRC_TOKEN), never here.
# [irc]
# enabled = false
# channel = "#frog"
# account = "my-mac"
