name: release

on:
  push:
    tags: ["v*"]
  # Dry run: builds and smoke-tests everything, publishes nothing.
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            zig: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            zig: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            zig: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: install zigbuild
        if: matrix.zig
        run: |
          pip3 install ziglang
          cargo install --locked cargo-zigbuild
      - name: build
        env:
          TARGET: ${{ matrix.target }}
          ZIG: ${{ matrix.zig }}
        run: |
          if [ "$ZIG" = "true" ]; then
            cargo zigbuild --release -p frog --target "$TARGET"
          else
            cargo build --release -p frog --target "$TARGET"
          fi
      - name: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ZIG: ${{ matrix.zig }}
        run: |
          name="frog-${GITHUB_REF_NAME//\//-}-${TARGET}"
          mkdir -p "dist/$name"
          cp "target/${TARGET}/release/frog" "dist/$name/"
          # host strip can't read zig's cross output; native builds only
          if [ "$ZIG" != "true" ]; then strip "dist/$name/frog"; fi
          cp README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          # Unversioned asset for the Frog Cloud sandbox image (zest pins
          # FROG_VERSION and fetches this from releases/download/<tag>/).
          # `frog` sits at the tarball root.
          if [ "$TARGET" = x86_64-unknown-linux-gnu ]; then
            tar -C "$name" -czf "frog-$TARGET.tar.gz" frog
            sha256sum "frog-$TARGET.tar.gz" > "frog-$TARGET.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  # Run the cloud asset on the sandbox base image: frog starts, and bwrap
  # can run frog's own probe (crates/frog-engine/src/tools/bash.rs).
  # --privileged stands in for the microVM, where bwrap gets real namespaces.
  smoke-cloud:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: x86_64-unknown-linux-gnu
          path: dist
      - name: smoke on node:24-trixie-slim
        run: |
          cd dist
          sha256sum -c frog-x86_64-unknown-linux-gnu.tar.gz.sha256
          docker run --rm --privileged -v "$PWD:/dist:ro" node:24-trixie-slim sh -euxc '
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends bubblewrap >/dev/null
            tar -xzf /dist/frog-x86_64-unknown-linux-gnu.tar.gz -C /usr/local/bin
            frog --version
            bwrap --ro-bind / / --dev-bind /dev /dev /bin/sh -c :
          '

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke-cloud]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: combined checksums
        run: cd dist && cat ./*.sha256 > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/SHA256SUMS
