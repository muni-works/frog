name: release

on:
  push:
    tags:
      - "v*"
      - "v*-rc*"
  # Dry run: builds and smoke-tests, publishes nothing.
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            zig: false
            # The app needs a private tang checkout (FROG_REQUIRE_TANG), which CI doesn't
            # have; signed app releases come from apps/macos/scripts/release.sh. CI ships the CLI.
            bundle: false
          # zig pins glibc 2.36 so the binary runs on debian trixie
          # (node:24-trixie-slim, the Frog Cloud sandbox base)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            zig: true
            glibc: ".2.36"
            bundle: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            zig: true
            bundle: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Only the macOS bundle needs tang: build-engine.sh requires tang-llm when
      # FROG_REQUIRE_TANG=1, and the Linux CLI tarballs don't ship the app.
      - uses: actions/checkout@v4
        if: matrix.bundle
        with:
          repository: muni-works/tang
          ref: main
          path: tang
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: install zigbuild
        if: matrix.zig
        run: |
          pip3 install ziglang
          cargo install --locked cargo-zigbuild
      - name: build
        env:
          TARGET: ${{ matrix.target }}
          ZIG: ${{ matrix.zig }}
          GLIBC: ${{ matrix.glibc }}
        run: |
          if [ "$ZIG" = "true" ]; then
            cargo zigbuild --release -p frog --target "$TARGET$GLIBC"
          else
            cargo build --release -p frog --target "$TARGET"
          fi
      - name: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          # the macOS app bundle is release-only; dry runs skip it
          BUNDLE: ${{ matrix.bundle && startsWith(github.ref, 'refs/tags/') }}
          # tang checkout for the macOS bundle leg; build-engine.sh resolves TANG_DIR
          # directly (not relative to the repo), so this picks up the checkout above.
          TANG_DIR: ${{ matrix.bundle && format('{0}/tang', github.workspace) || '' }}
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          name="frog-${GITHUB_REF_NAME//\//-}-${TARGET}"
          mkdir -p "dist/$name"
          cp "target/${TARGET}/release/frog" "dist/$name/"
          # host strip can't read the aarch64 cross output
          if [ "$TARGET" != aarch64-unknown-linux-gnu ]; then strip "dist/$name/frog"; fi
          cp README.md "dist/$name/"
          # Developer ID sign + notarize the darwin CLI when the Apple secrets are set
          # (after strip, which would invalidate the signature). Without them the
          # binary ships unsigned and install.sh ad-hoc signs it.
          if [ "$TARGET" = aarch64-apple-darwin ] && [ -n "$APPLE_CERT_P12" ]; then
            kc="$RUNNER_TEMP/frog-sign.keychain-db"
            kcpw=$(openssl rand -hex 16)
            echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$kcpw" "$kc"
            security set-keychain-settings -lut 21600 "$kc"
            security unlock-keychain -p "$kcpw" "$kc"
            security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
            # shellcheck disable=SC2046 # one arg per existing keychain
            security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
            rm -f "$RUNNER_TEMP/cert.p12"
            codesign --force --options runtime --timestamp --keychain "$kc" \
              --sign "Developer ID Application" "dist/$name/frog"
            codesign --verify --strict --verbose=2 "dist/$name/frog"
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
              # a bare binary can't be stapled; Gatekeeper checks the ticket online
              ditto -c -k "dist/$name/frog" "$RUNNER_TEMP/frog-notarize.zip"
              xcrun notarytool submit "$RUNNER_TEMP/frog-notarize.zip" --wait \
                --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
            else
              echo "::warning::APPLE_ID/APPLE_TEAM_ID/APPLE_APP_PASSWORD not set; skipping notarization"
            fi
          elif [ "$TARGET" = aarch64-apple-darwin ]; then
            echo "::warning::APPLE_CERT_P12 not set; darwin CLI ships unsigned"
          fi
          if [ "$BUNDLE" = "true" ]; then
            # For macOS, also build and package the app for unsigned releases
            # Signed releases use the full release.sh script
            brew install xcodegen
            cd apps/macos
            xcodegen generate --quiet
            xcodebuild build -quiet \
              -project Frog.xcodeproj -scheme Frog -configuration Release \
              -derivedDataPath build/release -destination 'generic/platform=macOS' \
              ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
              MARKETING_VERSION="${GITHUB_REF_NAME#v}" CURRENT_PROJECT_VERSION="1" \
              FROG_REQUIRE_TANG=1 \
              CODE_SIGN_IDENTITY="-" \
              DEVELOPMENT_TEAM="" \
              CODE_SIGN_STYLE="Manual"
            APP="build/dist/${GITHUB_REF_NAME#v}/Frog.app"
            ditto "build/release/Build/Products/Release/Frog.app" "$APP"
            # Zip lands at dist/ root, not inside dist/$name/.
            ditto -c -k --keepParent "$APP" "../../dist/Frog.zip"
            cd -
          fi
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
            if [ "$BUNDLE" = "true" ]; then
              sha256sum "Frog.zip" > "Frog.zip.sha256"
            fi
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
            if [ "$BUNDLE" = "true" ]; then
              shasum -a 256 "Frog.zip" > "Frog.zip.sha256"
            fi
          fi
          # Unversioned asset for the Frog Cloud sandbox image (zest pins
          # FROG_VERSION and fetches this from releases/download/<tag>/).
          # `frog` sits at the tarball root.
          if [ "$TARGET" = x86_64-unknown-linux-gnu ]; then
            tar -C "$name" -czf "frog-$TARGET.tar.gz" frog
            sha256sum "frog-$TARGET.tar.gz" > "frog-$TARGET.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/Frog.zip
            dist/Frog.zip.sha256

  # Run the cloud asset on the sandbox base image: frog starts, and bwrap
  # can run frog's own probe (crates/frog-engine/src/tools/bash.rs).
  # --privileged stands in for the microVM, where bwrap gets real namespaces.
  smoke-cloud:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: x86_64-unknown-linux-gnu
          path: dist
      - name: smoke on node:24-trixie-slim
        run: |
          cd dist
          sha256sum -c frog-x86_64-unknown-linux-gnu.tar.gz.sha256
          docker run --rm --privileged -v "$PWD:/dist:ro" node:24-trixie-slim sh -euxc '
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends bubblewrap >/dev/null
            tar -xzf /dist/frog-x86_64-unknown-linux-gnu.tar.gz -C /usr/local/bin
            frog --version
            bwrap --ro-bind / / --dev-bind /dev /dev /bin/sh -c :
          '

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke-cloud]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: combined checksums
        run: cd dist && cat ./*.sha256 > SHA256SUMS
      # install.sh verifies <tarball>.minisig against the key embedded in it. The secret is
      # an unencrypted minisign key (`minisign -G -W`); without it, no .minisig is published.
      - name: minisign tarballs
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::warning::MINISIGN_SECRET_KEY not set; release tarballs are unsigned"
            exit 0
          fi
          sudo apt-get install -y -qq minisign >/dev/null
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          for f in dist/*.tar.gz; do
            minisign -S -s "$RUNNER_TEMP/minisign.key" -m "$f" -t "frog ${GITHUB_REF_NAME} $(basename "$f")"
          done
          rm -f "$RUNNER_TEMP/minisign.key"
      # Render packaging/homebrew/frog.rb for this release (stable tags only).
      - name: homebrew formula
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          sha() { cut -d' ' -f1 < "dist/frog-${GITHUB_REF_NAME}-$1.tar.gz.sha256"; }
          sed -e "s/@VERSION@/$v/" \
              -e "s/@SHA256_AARCH64_APPLE_DARWIN@/$(sha aarch64-apple-darwin)/" \
              -e "s/@SHA256_AARCH64_UNKNOWN_LINUX_GNU@/$(sha aarch64-unknown-linux-gnu)/" \
              -e "s/@SHA256_X86_64_UNKNOWN_LINUX_GNU@/$(sha x86_64-unknown-linux-gnu)/" \
              packaging/homebrew/frog.rb > dist/frog.rb
          if grep -n '@[A-Z0-9_]*@' dist/frog.rb; then echo "unfilled placeholder"; exit 1; fi
      - name: check if prerelease
        id: prerelease
        run: |
          if [[ "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+$ ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/SHA256SUMS
            dist/*.minisig
            dist/frog.rb
            dist/Frog.zip
            dist/Frog.zip.sha256
          prerelease: ${{ steps.prerelease.outputs.prerelease == 'true' }}
      # Push the rendered formula to the tap when a token for it is configured.
      - name: update homebrew tap
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN not set; formula attached to the release only"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/muni-works/homebrew-muni.git" tap
          mkdir -p tap/Formula
          cp dist/frog.rb tap/Formula/frog.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/frog.rb
          git diff --cached --quiet || { git commit -m "frog ${GITHUB_REF_NAME}" && git push; }
