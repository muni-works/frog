name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            zig: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            zig: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            zig: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: install zigbuild
        if: matrix.zig
        run: |
          pip3 install ziglang
          cargo install --locked cargo-zigbuild
      - name: build
        env:
          TARGET: ${{ matrix.target }}
          ZIG: ${{ matrix.zig }}
        run: |
          if [ "$ZIG" = "true" ]; then
            cargo zigbuild --release -p frog --target "$TARGET"
          else
            cargo build --release -p frog --target "$TARGET"
          fi
      - name: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name="frog-${GITHUB_REF_NAME}-${TARGET}"
          mkdir -p "dist/$name"
          cp "target/${TARGET}/release/frog" "dist/$name/"
          cp README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: combined checksums
        run: cd dist && cat ./*.sha256 > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/SHA256SUMS
