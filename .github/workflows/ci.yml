name: ci

on:
  push:
    # The merge queue's temporary branches are tested through merge_group, below.
    branches-ignore: ["gh-readonly-queue/**"]
  pull_request:
  # A merge queue tests each PR on top of main and the PRs queued ahead of it, then merges the
  # commit it tested. The required checks must report on that commit, so every required job
  # runs here too.
  merge_group:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    if: false
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # A green run takes about 5 minutes, a cold cache about 20. Without this a stuck job holds
    # its runner for GitHub's 6-hour default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # puck is a workspace member; build only frog + engine.
      - run: cargo build -p frog -p frog-engine
      # No -D warnings yet: frog-engine has outstanding clippy warnings.
      - run: cargo clippy -p frog -p frog-engine
      # A hung test ends its binary after FROG_TEST_TIMEOUT seconds (crates/frog-engine/src/
      # test_watchdog.rs; default 300), and libtest names it ("has been running for over 60
      # seconds") above the watchdog's message. The step timeout is the backstop.
      - run: cargo test -p frog-engine -p frog
        timeout-minutes: 20
      # schema.rs's artifact_matches_types rewrites schema/frog-engine-1.json from the
      # protocol types; a diff here means the committed artifact is stale.
      - name: protocol schema is regenerated and committed
        run: git diff --exit-code -- crates/frog-engine/schema/frog-engine-1.json

  # cargo passing doesn't mean the app builds: compile the Swift app and run its unit tests.
  # PRs, the merge queue and main only (not every branch push), since macOS minutes are the
  # expensive ones. It must run for merge_group: a skipped required job counts as passing.
  macos-app:
    # PROBE: always, three ways at once.
    strategy:
      fail-fast: false
      matrix:
        probe: [iso-a, iso-b, full]
    # The app targets macOS 26 (SwiftPM tools 6.2), so it needs the macOS 26 image's Xcode.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The engine build that build-engine.sh runs (cargo registry + target/).
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-app
      - name: cache SwiftPM sidecar builds
        uses: actions/cache@v4
        with:
          path: |
            sidecars/frog-apple/.build
            sidecars/frog-desktop/.build
          key: sidecars-${{ runner.os }}-${{ hashFiles('sidecars/*/Package.swift', 'sidecars/*/Sources/**') }}
          restore-keys: sidecars-${{ runner.os }}-
      - name: install xcodegen
        run: brew install xcodegen
      # ToolRowRenderTests reads the rendered tool row back out of its PNG, which is the only
      # way a test can see the label drawn twice (a hosted SwiftUI view exposes no text to the
      # accessibility tree). Without this the test skips, and the pixel half of the guard is
      # absent from CI. Cached: it's a formula, not a build.
      - name: install tesseract (the tool row's readback)
        run: |
          brew install tesseract || brew upgrade tesseract
          tesseract --version | head -1
      - name: generate project
        run: cd apps/macos && xcodegen generate --quiet
      # build-engine.sh (pre-build phase) builds frog + the frog-apple/frog-desktop sidecars.
      # No tang checkout here, so it skips tang-llm with a warning (no FROG_REQUIRE_TANG).
      - name: build
        run: |
          cd apps/macos
          xcodebuild build -quiet \
            -project Frog.xcodeproj -scheme Frog -configuration Debug \
            -derivedDataPath build/ci -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_IDENTITY="-" DEVELOPMENT_TEAM="" CODE_SIGN_STYLE="Manual"
      - name: test
        # xcodebuild passes TEST_RUNNER_* to the test process without the prefix: the tests see
        # CI and give wall-clock budgets runner room (FrogTests TestRunner). A failing test gets
        # up to 2 more tries (the window benchmarks share a VM's frames); it must pass once.
        # A test past 5 minutes fails as "exceeded execution time allowance", by name; the
        # whole step takes about 7. -quiet keeps the log short but drops the assertion text, so
        # the run writes a result bundle, and the next two steps read the failures back out.
        env:
          TEST_RUNNER_CI: "true"
          TEST_RUNNER_FROG_DIAG_DIR: ${{ github.workspace }}/diag
          TEST_RUNNER_FROG_DIAG_ALLOWANCE: "1"
        timeout-minutes: 45
        run: |
          cd apps/macos
          set +e
          if [ "${{ matrix.probe }}" != full ]; then
            xcodebuild test -test-iterations 25 \
              -test-timeouts-enabled YES -default-test-execution-time-allowance 300 \
              -only-testing:FrogTests/TableTranscriptParityTests/testStreamingShowsWordsAndFollows \
              -resultBundlePath build/ci/Test.xcresult \
              -project Frog.xcodeproj -scheme Frog -configuration Debug \
              -derivedDataPath build/ci -destination 'platform=macOS,arch=arm64' \
              CODE_SIGN_IDENTITY="-" DEVELOPMENT_TEAM="" CODE_SIGN_STYLE="Manual" 2>&1 | grep -aE "DIAG|Test Case|Executed|error:" | grep -v Connection
            exit ${PIPESTATUS[0]}
          fi
          xcodebuild test -quiet -retry-tests-on-failure -test-iterations 3 \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 300 \
            -resultBundlePath build/ci/Test.xcresult \
            -project Frog.xcodeproj -scheme Frog -configuration Debug \
            -derivedDataPath build/ci -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_IDENTITY="-" DEVELOPMENT_TEAM="" CODE_SIGN_STYLE="Manual"
      - name: upload probe diag
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-diag-${{ matrix.probe }}
          path: diag
          if-no-files-found: ignore
      # Each failing test with its assertion message, in the log and as a check annotation.
      # It lists every failed try, so a test that failed and then passed on a retry shows too.
      - name: test failures
        if: failure() && hashFiles('apps/macos/build/ci/Test.xcresult/Info.plist') != ''
        run: |
          xcrun xcresulttool get test-results summary \
            --path apps/macos/build/ci/Test.xcresult --format json |
            jq -r '.testFailures[] | "::error title=\(.testIdentifierString)::\(.failureText | gsub("\n"; "%0A"))"'
      # The whole bundle (logs, attachments, timings) for anything the summary doesn't say.
      - name: upload test results
        if: failure() && hashFiles('apps/macos/build/ci/Test.xcresult/Info.plist') != ''
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-xcresult-${{ matrix.probe }}
          path: apps/macos/build/ci/Test.xcresult
          retention-days: 14
      # Release builds break differently from Debug (DEBUG-only symbols used
      # unconditionally, warnings as errors differences): the launch pipeline
      # (release.yml) builds Release, so CI guards it too.
      - name: build Release
        run: |
          cd apps/macos
          xcodebuild build -quiet \
            -project Frog.xcodeproj -scheme Frog -configuration Release \
            -derivedDataPath build/ci-release -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_IDENTITY="-" DEVELOPMENT_TEAM="" CODE_SIGN_STYLE="Manual"

      # The remote app's targets (iPhone, iPad, extensions): the same Swift as the Mac, but
      # these targets compile FrogKit/UI/Basics without UI/Transcript, which is where
      # cross-folder drift breaks them. Simulator destinations, so no signing is needed.
      # (The Watch app was cut in fb778843, which removed the FrogWatch and FrogWatchWidgets
      # targets from project.yml; its build step is gone with them. Restore the targets first
      # if Watch comes back.)
      - name: generate iOS project
        run: cd apps/ios && xcodegen generate --quiet
      - name: build iOS app
        run: |
          cd apps/ios
          xcodebuild build -quiet \
            -project FrogRemote.xcodeproj -scheme Frog -configuration Debug \
            -derivedDataPath build/ci -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  web:
    if: false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
