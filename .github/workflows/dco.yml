name: dco
on: pull_request

jobs:
  check-dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit is signed off (Developer Certificate of Origin)
        run: |
          base=${{ github.event.pull_request.base.sha }}
          head=${{ github.event.pull_request.head.sha }}
          missing=0
          for c in $(git rev-list --no-merges "$base..$head"); do
            if ! git log -1 --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+>'; then
              echo "::error::commit $(git log -1 --format='%h %s' "$c") has no Signed-off-by (use git commit -s)"
              missing=1
            fi
          done
          exit $missing
