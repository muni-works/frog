name: DCO Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-dco:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check DCO
        uses: 10up/actions-dco@v1.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
