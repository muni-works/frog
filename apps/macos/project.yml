name: Kiln
options:
  bundleIdPrefix: com.campedersen
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
targets:
  Kiln:
    type: application
    platform: macOS
    sources:
      - path: Kiln
    info:
      path: Kiln/Info.plist
      properties:
        CFBundleDisplayName: Kiln
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026 Cam Pedersen"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.campedersen.kiln
    preBuildScripts:
      - name: Build kiln engine
        script: '"$SRCROOT/scripts/build-engine.sh"'
        basedOnDependencyAnalysis: false
  KilnTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: KilnTests
        buildPhase: sources
        excludes: ["*.jsonl"]
      - path: KilnTests/events.jsonl
        buildPhase: resources
    dependencies:
      - target: Kiln
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.campedersen.kiln.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Kiln.app/Contents/MacOS/Kiln"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Kiln:
    build:
      targets:
        Kiln: all
        KilnTests: [test]
    test:
      targets:
        - KilnTests
