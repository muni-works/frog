name: Frog
options:
  bundleIdPrefix: toys.frog
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.7.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
targets:
  Frog:
    type: application
    platform: macOS
    sources:
      - path: Frog
        excludes: ["Frog.entitlements"]
      # The layered Icon Composer icon; ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon
      # matches this file's name (the empty appiconset holds the folder open in Xcode).
      - path: Frog/AppIcon.icon
        buildPhase: resources
      # Shared with the iOS app and its extensions (see FrogKit/README.md).
      - path: ../FrogKit
        excludes: ["README.md"]
    dependencies:
      - package: Sparkle
    info:
      path: Frog/Info.plist
      properties:
        CFBundleDisplayName: Frog
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Sparkle: frog.toys redirects to the latest release's appcast, so hosting can move
        # without shipping an update. Only the release build (toys.frog) ever checks it.
        SUFeedURL: https://frog.toys/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSUserActivityTypes: [toys.frog.conversation]
        NSLocalNetworkUsageDescription: "frog on your iPhone connects to this Mac over your network, and frog finds machines that can run models for you on it."
        NSBonjourServices: [_frog._tcp, _frog-node._tcp]
        NSHumanReadableCopyright: "© 2026 Municipal Robotics"
        NSMicrophoneUsageDescription: "Frog listens only while you dictate into the composer. Speech is transcribed on this Mac; audio never leaves it."
        NSSpeechRecognitionUsageDescription: "Frog turns your dictation into text on this Mac. Nothing is sent to Apple or anyone else."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: toys.frog
        CODE_SIGN_ENTITLEMENTS: Frog/Frog.entitlements
        # The EdDSA public key for update signatures. Its private half lives in the release
        # machine's Keychain (Sparkle's generate_keys); see scripts/release.sh.
        SPARKLE_PUBLIC_KEY: BLziGLx/omop7rhIoQuyOTqj1ssTJi+KJcGfpIAL1WY=
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      # Debug builds (this checkout, worktrees, agents) are their own app, so macOS never
      # hands the installed frog's notifications, URLs or relaunches to a stray build.
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: toys.frog.dev
    preBuildScripts:
      - name: Build frog engine
        script: '"$SRCROOT/scripts/build-engine.sh"'
        basedOnDependencyAnalysis: false
  FrogTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FrogTests
        buildPhase: sources
        excludes: ["*.jsonl", "*.json"]
      - path: FrogTests/events.jsonl
        buildPhase: resources
      - path: FrogTests/diagram-folded.json
        buildPhase: resources
    dependencies:
      - target: Frog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: toys.frog.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Frog.app/Contents/MacOS/Frog"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Frog:
    build:
      targets:
        Frog: all
        FrogTests: [test]
    test:
      targets:
        - FrogTests
