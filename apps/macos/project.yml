name: Frog
options:
  bundleIdPrefix: com.campedersen
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
targets:
  Frog:
    type: application
    platform: macOS
    sources:
      - path: Frog
    info:
      path: Frog/Info.plist
      properties:
        CFBundleDisplayName: Frog
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026 Cam Pedersen"
        NSMicrophoneUsageDescription: "Frog listens only while you dictate into the composer. Speech is transcribed on this Mac; audio never leaves it."
        NSSpeechRecognitionUsageDescription: "Frog turns your dictation into text on this Mac. Nothing is sent to Apple or anyone else."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.campedersen.frog
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    preBuildScripts:
      - name: Build frog engine
        script: '"$SRCROOT/scripts/build-engine.sh"'
        basedOnDependencyAnalysis: false
  FrogTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FrogTests
        buildPhase: sources
        excludes: ["*.jsonl"]
      - path: FrogTests/events.jsonl
        buildPhase: resources
    dependencies:
      - target: Frog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.campedersen.frog.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Frog.app/Contents/MacOS/Frog"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Frog:
    build:
      targets:
        Frog: all
        FrogTests: [test]
    test:
      targets:
        - FrogTests
