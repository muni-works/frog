<svg xmlns="http://www.w3.org/2000/svg" width="540" height="360" viewBox="0 0 540 360">
  <!-- Frog.dmg window background. Icons sit at (140,170) and (400,170), 128pt (release.sh).
       Render: apps/macos/dmg/render.sh -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#fbfaf7"/>
      <stop offset="1" stop-color="#efede6"/>
    </radialGradient>
    <radialGradient id="pad" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#dcefdc"/>
      <stop offset="1" stop-color="#c9e5cc"/>
    </radialGradient>
    <symbol id="mark" viewBox="0 0 100 100">
      <path fill-rule="evenodd" d="M12 30a18 18 0 1 0 36 0a18 18 0 1 0 -36 0Z M23.5 27a6.5 6.5 0 1 0 13 0a6.5 6.5 0 1 0 -13 0Z"/>
      <path fill-rule="evenodd" d="M52 30a18 18 0 1 0 36 0a18 18 0 1 0 -36 0Z M63.5 27a6.5 6.5 0 1 0 13 0a6.5 6.5 0 1 0 -13 0Z"/>
      <path fill-rule="evenodd" d="M8 62a42 29 0 1 0 84 0a42 29 0 1 0 -84 0Z M31 66Q50 82 69 66Q50 75 31 66Z M41.5 53a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0Z M53.5 53a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0Z"/>
    </symbol>
  </defs>
  <rect width="540" height="360" fill="url(#glow)"/>

  <!-- ripples -->
  <g fill="none" stroke="#2e9e4f" stroke-opacity="0.07" stroke-width="1.2">
    <ellipse cx="140" cy="214" rx="92" ry="22"/>
    <ellipse cx="140" cy="214" rx="118" ry="30"/>
    <ellipse cx="400" cy="214" rx="92" ry="22"/>
    <ellipse cx="400" cy="214" rx="118" ry="30"/>
  </g>

  <!-- lily pads, notch toward the hop -->
  <path fill="url(#pad)" d="M140 214 L210.4 208.6 A72 26 0 1 0 210.4 219.4 Z"/>
  <path fill="url(#pad)" d="M400 214 L329.6 208.6 A72 26 0 1 1 329.6 219.4 Z"/>

  <!-- the hop -->
  <path d="M206 150 Q270 72 334 150" fill="none" stroke="#2e9e4f" stroke-width="2.2"
        stroke-linecap="round" stroke-dasharray="0.1 9"/>
  <path d="M-8 -6 L0 0 L-8 6" transform="translate(334 150) rotate(50.6)" fill="none" stroke="#2e9e4f" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- wordmark; the text is drawn by render.sh (rsvg ignores bundled fonts) -->
  <use href="#mark" x="22" y="20" width="22" height="22" fill="#2e9e4f"/>
</svg>
