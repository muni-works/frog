[package]
name = "frog-gtk"
description = "frog's Linux app: GTK 4 + libadwaita, speaks frog --serve"
version.workspace = true
edition.workspace = true

[[bin]]
name = "frog-app"
path = "src/main.rs"

[dependencies]
frog-engine.workspace = true
serde_json.workspace = true
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_8"] }
sourceview5 = { version = "0.11", features = ["v5_16"] }
async-channel = "2.5"
