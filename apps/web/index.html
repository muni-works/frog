<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" />
    <link rel="icon" href="/frog-icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Add to Home Screen: a standalone app, the frog icon, a dark background (manifest.webmanifest). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Frog" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Frog</title>
    <meta name="description" content="Hand it off. Come back to a PR. A coding agent in its own cloud machine, on open models." />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Frog" />
    <meta property="og:url" content="https://frog.toys/" />
    <meta property="og:title" content="Frog — hand it off, come back to a PR" />
    <meta property="og:description" content="A coding agent in its own cloud machine, on open models. Pay for the tokens you use." />
    <meta property="og:image" content="https://frog.toys/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Frog mark over a night pond with ripples, lily pads and fireflies: Hand it off. Come back to a PR." />
    <meta property="og:video" content="https://frog.toys/og.mp4" />
    <meta property="og:video:secure_url" content="https://frog.toys/og.mp4" />
    <meta property="og:video:type" content="video/mp4" />
    <meta property="og:video:width" content="1200" />
    <meta property="og:video:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Frog — hand it off, come back to a PR" />
    <meta name="twitter:description" content="A coding agent in its own cloud machine, on open models." />
    <meta name="twitter:image" content="https://frog.toys/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Settings › Appearance's theme, before first paint (src/settings.ts). -->
    <script>try { var t = localStorage.getItem('frog.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t } catch (e) {}</script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
