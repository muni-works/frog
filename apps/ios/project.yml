name: FrogRemote
options:
  bundleIdPrefix: toys.frog
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 54SNZV8YN8
    CODE_SIGN_STYLE: Automatic
targets:
  Frog:
    type: application
    platform: iOS
    dependencies:
      - target: FrogPush
    sources:
      - path: Frog
        excludes: ["*.entitlements"]
      # The Mac's layered Icon Composer icon, so iPhone and Mac share one (AppIcon).
      - path: ../macos/Frog/AppIcon.icon
        buildPhase: resources
      - path: Shared
      - path: ../FrogKit
        excludes: ["README.md"]
      # The Mac's recorded sessions, for designing without a Mac (-fixtures YES).
      - path: ../macos/Fixtures
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: toys.frog.remote
        PRODUCT_NAME: Frog
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) FROG_APP
        CODE_SIGN_ENTITLEMENTS: Frog/Frog.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Frog
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Frog connects to frog on your Mac."
        INFOPLIST_KEY_NSCameraUsageDescription: "To scan the pairing code on your Mac."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Frog/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSUserActivityTypes: [toys.frog.conversation]
        FrogKeychainGroup: $(AppIdentifierPrefix)toys.frog.remote
        NSBonjourServices: [_frog._tcp]
        CFBundleURLTypes:
          - CFBundleURLName: toys.frog.remote
            CFBundleURLSchemes: [frog]
  # Opens a sealed push from the Mac before iOS shows it (PushCrypto): the relay and Apple
  # carry a placeholder; the phone has the pairing code.
  FrogPush:
    type: app-extension
    platform: iOS
    dependencies:
      - sdk: UserNotifications.framework
    sources:
      - path: PushService
        excludes: ["*.entitlements"]
      - path: Shared/PairingCode.swift
        group: Shared
      - path: ../FrogKit/Core/PushCrypto.swift
        group: FrogKit/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: toys.frog.remote.push
        CODE_SIGN_ENTITLEMENTS: PushService/PushService.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Frog
    info:
      path: PushService/Info.plist
      properties:
        CFBundleDisplayName: Frog
        FrogKeychainGroup: $(AppIdentifierPrefix)toys.frog.remote
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
