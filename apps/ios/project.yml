name: FrogRemote
options:
  bundleIdPrefix: eco.frog
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 54SNZV8YN8
    CODE_SIGN_STYLE: Automatic
targets:
  Frog:
    type: application
    platform: iOS
    dependencies:
      - target: FrogNotify
      - target: FrogWidgets
      - target: FrogWatch
    sources:
      - path: Frog
      - path: Shared
      # The engine protocol, shared with the Mac app.
      - path: ../macos/Frog/Engine/Protocol.swift
        group: Shared
      - path: ../macos/Frog/Engine/Diagram.swift
        group: Shared
      - path: ../macos/Frog/Views/FrogFace.swift
        group: Shared
      # The Mac's recorded sessions, for designing without a Mac (-fixtures YES).
      - path: ../macos/Fixtures
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eco.frog.remote
        PRODUCT_NAME: Frog
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) FROG_APP
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Frog
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Frog connects to frog on your Mac."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Frog/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSUserActivityTypes: [eco.frog.conversation]
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: eco.frog.remote
            CFBundleURLSchemes: [frog]
  # Long-press a question from frog: the command or the diff, before you allow it.
  FrogNotify:
    type: app-extension
    platform: iOS
    dependencies:
      - sdk: UserNotifications.framework
      - sdk: UserNotificationsUI.framework
    sources:
      - path: NotificationContent
      - path: Shared
      - path: ../macos/Frog/Engine/Protocol.swift
        group: Shared
      - path: ../macos/Frog/Engine/Diagram.swift
        group: Shared
      - path: ../macos/Frog/Views/FrogFace.swift
        group: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eco.frog.remote.notify
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Frog
    info:
      path: NotificationContent/Info.plist
      properties:
        CFBundleDisplayName: Frog
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.content-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationViewController
          NSExtensionAttributes:
            UNNotificationExtensionCategory: PERMISSION
            UNNotificationExtensionDefaultContentHidden: true
            UNNotificationExtensionInitialContentSizeRatio: 0.5
  # The lock screen and Dynamic Island while a turn runs; later, widgets and controls.
  FrogWidgets:
    type: app-extension
    platform: iOS
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
    sources:
      - path: Widgets
      - path: Shared
      - path: ../macos/Frog/Engine/Protocol.swift
        group: Shared
      - path: ../macos/Frog/Engine/Diagram.swift
        group: Shared
      - path: ../macos/Frog/Views/FrogFace.swift
        group: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eco.frog.remote.widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Frog
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Frog
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  # frog on your wrist: what needs you, answered with a tap.
  FrogWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: Watch
      - path: ../macos/Frog/Views/FrogFace.swift
        group: Shared
      - path: Shared/Palette.swift
        group: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eco.frog.remote.watchkitapp
        PRODUCT_NAME: Frog
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Frog
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: eco.frog.remote
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Frog
        WKCompanionAppBundleIdentifier: eco.frog.remote
