name: TangSpike
options:
  bundleIdPrefix: toys.frog
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    DEVELOPMENT_TEAM: 54SNZV8YN8
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  TangSpike:
    type: application
    platform: iOS
    sources: [TangSpike]
    dependencies:
      - framework: Tang/TangLLM.xcframework
        embed: false
      - sdk: Metal.framework
      - sdk: Accelerate.framework
      - sdk: Foundation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: toys.frog.tangspike
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        OTHER_LDFLAGS: [-lc++]
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
