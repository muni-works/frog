# An edit, then the conversation is closed and resumed by a new engine (quit and reopen): the
# server should still hold the conversation (memory or disk), so the resumed turn prefills only
# what's new. The prompts spell out the code, so even a small model's edits land and the
# project (and its repo map) really changes before the resume.
prompt = """python3 test_inventory.py fails: removing all of an item should drop it. In inventory.py, replace the line

        self.items[name] = left

with

        if left:
            self.items[name] = left
        else:
            self.items.pop(name, None)

and add this function to the end of inventory.py:

def from_counts(counts):
    inv = Inventory()
    for name, quantity in counts.items():
        inv.add(name, quantity)
    return inv

then run python3 test_inventory.py."""
check = "python3 test_inventory.py && python3 -c 'from inventory import Inventory; i = Inventory(); i.add(\"a\", 2); i.add(\"b\", 3); assert i.total_quantity() == 5'"
timeout_secs = 480

[[then]]
conversation = "resume"
prompt = """Add this method to the end of the Inventory class in inventory.py:

    def total_quantity(self):
        return sum(self.items.values())
"""
