# Follow-ups in one conversation, each after an edit: every request should only append to the
# one before, so after the first call each prefills just the new turn. The prompts spell out the
# code, so even a small model's edits land and the project (and its repo map) really changes.
prompt = """Add this function to the end of stats.py:

def median(xs):
    s = sorted(xs)
    n = len(s)
    return s[n // 2] if n % 2 else (s[n // 2 - 1] + s[n // 2]) / 2
"""
check = "python3 test_stats.py && python3 -c 'import stats; assert stats.median([3, 1, 2]) == 2; assert stats.median([4, 1, 3, 2]) == 2.5; assert stats.spread([5, 1, 9]) == 8'"
timeout_secs = 480

[[then]]
prompt = """Now add this one to the end of stats.py too:

def spread(xs):
    return max(xs) - min(xs)
"""

[[then]]
prompt = "Run python3 test_stats.py and tell me whether it passes."
