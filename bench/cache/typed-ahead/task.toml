# Zero-prefill turns (docs/design/zero-prefill.md): a long message with a pasted log, typed
# ahead (the engine warms the draft while the "user" types), against an equally long one sent
# cold. The typed turn's first call should find nearly all of its prompt cached, and its time to
# first token (the report's "typed s") be a small fraction of the cold one's.
prompt = "In one sentence, what does src/server.py do? Don't change any files."
check = "[ \"$(tr -d '[:space:]' < answer.txt)\" = 8431 ]"
timeout_secs = 480

