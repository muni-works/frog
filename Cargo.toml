[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
frog-engine = { path = "crates/frog-engine" }
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
futures-util = "0.3.34"
globset = "0.4.20"
ignore = "0.4.33"
libc = "0.2.189"
reedline = { version = "0.51.0", features = ["external_printer"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "3.2.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7"
toml = "1.1.6"
